<script>
const wrap = document.getElementById("playerWrap");
const frame = document.getElementById("playerFrame");

/* ================= STATE ================= */
let volume = 1;
let muted = false;

/* ================= EXTRACT STREAM ================= */
async function extractStream(url){
  try {
    const res = await fetch("/proxy.php?url=" + encodeURIComponent(url));

    const text = await res.text();

    let m3u8 = text.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/i);
    if (m3u8) return m3u8[0];

    let mp4 = text.match(/https?:\/\/[^\s"'<>]+\.mp4[^\s"'<>]*/i);
    if (mp4) return mp4[0];

    return null;

  } catch(e){
    console.log("extract failed", e);
    return null;
  }
}

/* ================= OPEN MODAL ================= */
function openPlayer(url, e){

  if (!e) {
    frame.src = url;
    wrap.classList.add("active");
    document.body.classList.add("playerActive");
    return;
  }

  const x = (e.clientX / window.innerWidth) * 100;
  const y = (e.clientY / window.innerHeight) * 100;

  wrap.style.transformOrigin = `${x}% ${y}%`;

  frame.src = url;
  wrap.classList.add("active");
  document.body.classList.add("playerActive");
}

/* ================= MOBILE EXTERNAL ================= */
function openExternalPlayer(url){
  const playerUrl = "/frame.html?src=" + encodeURIComponent(url);
  window.open(playerUrl, "_blank");
}

/* ================= TORRENT ================= */
function openTorrent(url){
  const page = "/torrent.html?src=" + encodeURIComponent(url);
  window.open(page, "_blank");
}

/* ================= SMART ROUTER ================= */
async function smartOpen(url, e){

  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);

  if (!url) return;

  /* ===== TORRENT MODE ===== */
  if (
    url.startsWith("magnet:") ||
    url.toLowerCase().endsWith(".torrent")
  ) {
    openTorrent(url);
    return;
  }

  /* ===== PLAYLIST / API DETECT ===== */
  if (url.includes("load-playlist")) {
    const extracted = await extractStream(url);

    if (extracted) {
      url = extracted;
    } else {
      alert("Stream extraction failed (CORS or invalid source)");
      return;
    }
  }

  /* ===== AUTO WRAP STREAM ===== */
  if (url.endsWith(".m3u8") || url.endsWith(".mp4")) {
    url = "/tv/playerjs.html?file=" + encodeURIComponent(url);
  }

  /* ===== DESKTOP ===== */
  if (!isMobile && e) {
    openPlayer(url, e);
    return;
  }

  /* ===== MOBILE ===== */
  openExternalPlayer(url);
}

/* ================= CLOSE ================= */
function closePlayer(){

  if (document.fullscreenElement) {
    document.exitFullscreen();
  }

  wrap.classList.remove("active");
  document.body.classList.remove("playerActive");

  setTimeout(() => {
    frame.src = "";
  }, 300);
}

/* ================= FULLSCREEN ================= */
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    wrap.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* ================= VOLUME ================= */
const slider = document.getElementById("volumeSlider");

if (slider) {
  slider.addEventListener("input", function(){
    volume = this.value / 100;
    if (volume > 0) muted = false;
    applyVolume();
  });
}

/* ================= MUTE ================= */
function toggleMute(){
  muted = !muted;
  applyVolume();
}

/* ================= APPLY VOLUME ================= */
function applyVolume(){
  try {
    const video = frame.contentWindow?.document?.querySelector("video");
    if (video) {
      video.volume = muted ? 0 : volume;
      return;
    }
  } catch(e) {}

  frame.style.filter = muted ? "grayscale(1) brightness(0.6)" : "none";
  frame.style.opacity = muted ? 0.85 : 1;

  const btn = document.getElementById("muteBtn");
  if (btn) btn.textContent = muted ? "🔇" : "🔊";
}

/* ================= ESC ================= */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePlayer();
});

/* ================= LINK HOOK ================= */
document.querySelectorAll(".play-link").forEach(btn => {
  btn.addEventListener("click", function(e){
    const url = this.dataset.src;
    smartOpen(url, e);
  });
});


/* ================= TV FIX (SAFE) ================= */
document.addEventListener("pointerdown", (e) => {

  let el = e.target;

  // 🔥 manual closest fallback (TV safe)
  while (el && !el.classList?.contains("play-link")) {
    el = el.parentNode;
  }

  if (!el) return;

  const url = el.dataset?.src;
  if (!url) return;

  smartOpen(url, {
    clientX: window.innerWidth / 2,
    clientY: window.innerHeight / 2
  });
});

/* ================= INPUT FOCUS ================= */
function focusInput(){
  const input = document.getElementById("streamInput");
  if (input){
    input.focus();
    input.click();
  }
}

document.querySelector(".play-input")?.addEventListener("click", focusInput);

document.getElementById("streamInput")?.addEventListener("touchstart", function(){
  this.focus();
});

/* ================= CUSTOM STREAM ================= */
function playCustomStream(){

  const input = document.getElementById("streamInput");
  if (!input) return;

  let url = input.value.trim();
  if (!url) return;

  localStorage.setItem("lastStream", url);

  smartOpen(url, {
    clientX: window.innerWidth / 2,
    clientY: window.innerHeight / 2
  });
}

/* ================= ENTER KEY ================= */
document.getElementById("streamInput")?.addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    playCustomStream();
  }
});

/* ================= RESTORE STREAM ================= */
window.addEventListener("load", () => {
  const saved = localStorage.getItem("lastStream");
  const input = document.getElementById("streamInput");

  if (saved && input) {
    input.value = saved.includes("playerjs.html?file=")
      ? decodeURIComponent(saved.split("file=")[1])
      : saved;
  }
});
</script>
